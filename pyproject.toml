[build-system]
requires = ["setuptools==80.3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "alpaca-swing-trading"
version = "0.3.0"
description = "Fail-closed AI-reviewed paper swing trading and research"
requires-python = ">=3.12"
dependencies = [
  "alpaca-py>=0.43,<1", "pandas>=2.3,<3", "numpy>=2,<2.4", "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3", "openai>=2,<3",
  "pandas-market-calendars>=5,<6", "requests>=2.32,<3",
  "gspread>=6,<7", "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1", "mypy>=1.18,<2", "PyYAML>=6,<7", "pandas-stubs>=2.3,<3", "types-requests>=2.32,<3"]

[project.scripts]
trading-bot = "trading_bot.cli:main"

[tool.setuptools]
packages = ["trading_bot"]
py-modules = ["strategy", "replay", "data_audit", "engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"
files = ["trading_bot/config.py", "trading_bot/models.py", "trading_bot/risk.py"]
