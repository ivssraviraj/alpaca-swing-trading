name: Alpaca Swing Engine

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'observe / replay / paper / report'
        required: true
        type: choice
        options:
          - observe
          - replay
          - paper
          - report
        default: observe
      replay_days:
        description: 'Replay lookback, calendar days (replay mode only)'
        type: choice
        required: false
        options:
          - '100'
          - '75'
          - '45'
        default: '100'
  # UTC envelope covers US regular sessions in EST and EDT.
  # Script checks Alpaca's clock and completed-bar freshness.
  # 15-min interval reduces cost; schedule is best-effort, NOT real-time.
  schedule:
    - cron: '3,18,33,48 13-22 * * 1-5'
    - cron: '17 14 * * 6'

permissions:
  contents: read
concurrency:
  group: alpaca-swing-execution
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      PAPER_ORDERS_ENABLED: ${{ vars.PAPER_ORDERS_ENABLED || 'false' }}
      PAPER_ONLY_ACK: ${{ vars.PAPER_ONLY_ACK || '' }}
      KILL_SWITCH: ${{ vars.KILL_SWITCH || 'false' }}
      STRATEGY_CAPITAL_USD: ${{ vars.STRATEGY_CAPITAL_USD || '25000' }}
      REPLAY_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.replay_days || '100' }}
      SYMBOLS: ${{ vars.SYMBOLS || 'SPY,QQQ,IWM,AAPL,MSFT,NVDA' }}
      GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || '' }}
      GOOGLE_SA_JSON_BASE64: ${{ secrets.GOOGLE_SA_JSON_BASE64 }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ALERT_WEBHOOK_KIND: ${{ vars.ALERT_WEBHOOK_KIND || 'discord' }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '17 14 * * 6' && 'report' || (vars.PAPER_ORDERS_ENABLED == 'true' && vars.PAPER_ONLY_ACK == 'YES_PAPER_ONLY' && vars.KILL_SWITCH != 'true' && 'paper' || 'observe')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run engine
        run: python engine.py --mode "$MODE"
      - name: Attach historical replay outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpaca-replay-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
