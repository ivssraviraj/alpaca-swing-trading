name: Validate Swing Code
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest --cov=trading_bot --cov-report=term-missing
      - run: python -m trading_bot replay --fixture tests/fixtures/market.json --archive tests/fixtures/events.json
      - run: python scripts/check_workflows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-research-${{ github.run_id }}
          path: reports/
