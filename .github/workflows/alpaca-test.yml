name: Alpaca Connection Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    environment: paper
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Read-only account and data verification
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          DATA_FEED: ${{ vars.DATA_FEED || 'iex' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'DEBUG' }}
          DEBUG_TRACES_ENABLED: ${{ vars.DEBUG_TRACES_ENABLED || 'true' }}
          PYTHONUNBUFFERED: '1'
        run: python -m trading_bot check-alpaca
      - name: Summarize connection check
        if: always()
        run: python scripts/write_run_summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpaca-connection-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
