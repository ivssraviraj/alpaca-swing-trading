name: Swing Engine Observation
on:
  workflow_dispatch:
    inputs:
      historical_observation:
        description: 'Inspect historical candles when market is closed (never place orders)'
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '*/15 14-20 * * 1-5'
permissions:
  contents: read
concurrency:
  group: swing-observation
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan paper account (no orders)
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          OBSERVATION_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.historical_observation || false }}
          ENABLE_PAPER_ORDERS: 'false'
        run: python engine.py
