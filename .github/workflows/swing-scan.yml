name: Alpaca Swing Engine
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Explicit operating mode (paper-execute requires all configuration gates)
        type: choice
        default: observe
        options: [observe, paper-dry-run, paper-execute, replay, weekly-report, check-alpaca, check-ai]
      replay_days:
        description: Calendar days for replay
        type: string
        default: '100'
  schedule:
    - cron: '3,18,33,48 13-22 * * 1-5'
    - cron: '17 14 * * 6'
permissions:
  contents: read
concurrency:
  group: alpaca-swing-single-executor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    environment: paper
    timeout-minutes: 14
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_SA_JSON_BASE64: ${{ secrets.GOOGLE_SA_JSON_BASE64 }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      PAPER_ORDERS_ENABLED: ${{ vars.PAPER_ORDERS_ENABLED || 'false' }}
      PAPER_ONLY_ACK: ${{ vars.PAPER_ONLY_ACK || '' }}
      EXECUTION_VALIDATED_ACK: ${{ vars.EXECUTION_VALIDATED_ACK || '' }}
      IEX_EXECUTION_ACK: ${{ vars.IEX_EXECUTION_ACK || '' }}
      KILL_SWITCH: ${{ vars.KILL_SWITCH || 'false' }}
      STRATEGY_CAPITAL_USD: ${{ vars.STRATEGY_CAPITAL_USD || '25000' }}
      AI_ENABLED: ${{ vars.AI_ENABLED || 'false' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4' }}
      AI_INPUT_USD_PER_MILLION: ${{ vars.AI_INPUT_USD_PER_MILLION || '2.5' }}
      AI_OUTPUT_USD_PER_MILLION: ${{ vars.AI_OUTPUT_USD_PER_MILLION || '15' }}
      AI_DAILY_BUDGET_USD: ${{ vars.AI_DAILY_BUDGET_USD || '1' }}
      AI_MAX_CALLS_DAILY: ${{ vars.AI_MAX_CALLS_DAILY || '30' }}
      DATA_FEED: ${{ vars.DATA_FEED || 'iex' }}
      UNIVERSE_MODE: ${{ vars.UNIVERSE_MODE || 'dynamic' }}
      UNIVERSE_SIZE: ${{ vars.UNIVERSE_SIZE || '100' }}
      SYMBOLS: ${{ vars.SYMBOLS || 'SPY,QQQ,IWM,AAPL,MSFT,NVDA' }}
      SHEETS_ENABLED: ${{ vars.SHEETS_ENABLED || 'false' }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'DEBUG' }}
      DEBUG_TRACES_ENABLED: ${{ vars.DEBUG_TRACES_ENABLED || 'true' }}
      SECTOR_MAP_PATH: ${{ vars.SECTOR_MAP_PATH || '' }}
      PYTHONUNBUFFERED: '1'
      GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || '' }}
      ALERT_WEBHOOK_KIND: ${{ vars.ALERT_WEBHOOK_KIND || 'discord' }}
      REPLAY_DAYS: ${{ inputs.replay_days || '100' }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '17 14 * * 6' && 'weekly-report' || (vars.PAPER_ORDERS_ENABLED == 'true' && 'paper-execute' || 'observe')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Run guarded engine
        run: python -m trading_bot "$MODE" --days "$REPLAY_DAYS"
      - name: Summarize scan and failures
        if: always()
        run: python scripts/write_run_summary.py
      - name: Retain audit export (not critical state)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpaca-audit-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
